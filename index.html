<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaLink UI Prototype - Interactive Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#111317",
            "surface-dim": "#111317",
            "surface-bright": "#37393d",
            "surface-container-lowest": "#0c0e11",
            "surface-container-low": "#1a1c1f",
            "surface-container": "#1e2023",
            "surface-container-high": "#282a2d",
            "surface-container-highest": "#333538",
            "on-surface": "#e2e2e6",
            "on-surface-variant": "#cbc3d7",
            "outline": "#958ea0",
            "outline-variant": "#494454",
            "primary": "#d0bcff",
            "primary-container": "#a078ff",
            "secondary": "#4cd7f6",
            "secondary-container": "#03b5d3",
            "error": "#ffb4ab",
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #111317;
      color: #e2e2e6;
      font-family: 'Inter', sans-serif;
    }
    .screen-iframe {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111317;
    }
    ::-webkit-scrollbar-thumb {
      background: #333538;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #494454;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-surface antialiased overflow-hidden select-none">
  <!-- Top Bar -->
  <header class="h-16 px-6 border-b border-surface-container-highest flex items-center justify-between bg-surface-container-low/90 backdrop-blur z-20 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary-container to-secondary flex items-center justify-center text-surface shadow-md shadow-primary-container/20">
        <span class="material-symbols-outlined text-[24px]">hub</span>
      </div>
      <div>
        <h1 class="text-base font-bold text-on-surface tracking-tight flex items-center gap-2">
          NexaLink <span class="text-xs font-mono px-2 py-0.5 rounded-full bg-primary/20 text-primary border border-primary/30">Prototype Hub</span>
        </h1>
        <p class="text-xs text-on-surface-variant font-mono">P2P Decentralized Academic Network UI</p>
      </div>
    </div>

    <!-- Frame Size Switcher -->
    <div class="flex items-center gap-1.5 bg-surface-container rounded-xl p-1 border border-outline-variant/30">
      <button onclick="setViewport('mobile')" id="btn-mobile" class="viewport-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-primary text-surface-dim shadow">
        <span class="material-symbols-outlined text-[16px]">smartphone</span>
        <span>Mobile (390px)</span>
      </button>
      <button onclick="setViewport('tablet')" id="btn-tablet" class="viewport-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high">
        <span class="material-symbols-outlined text-[16px]">tablet</span>
        <span>Tablet (768px)</span>
      </button>
      <button onclick="setViewport('full')" id="btn-full" class="viewport-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high">
        <span class="material-symbols-outlined text-[16px]">fullscreen</span>
        <span>Fill Viewport</span>
      </button>
    </div>

    <!-- External Launch Button -->
    <div class="flex items-center gap-3">
      <a id="open-external-btn" href="#" target="_blank" class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-surface-container-high hover:bg-surface-bright text-secondary text-xs font-medium transition-colors border border-secondary/20">
        <span>Open Screen in New Tab</span>
        <span class="material-symbols-outlined text-[14px]">open_in_new</span>
      </a>
    </div>
  </header>

  <!-- Main Content Body -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left Navigation Sidebar -->
    <aside class="w-80 border-r border-surface-container-highest bg-surface-container-low flex flex-col shrink-0 overflow-y-auto">
      <div class="p-4 border-b border-surface-container-highest/60 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant font-mono">Prototype Screens (10)</span>
        <span class="w-2 h-2 rounded-full bg-secondary animate-pulse" title="Mesh Simulation Active"></span>
      </div>

      <nav id="screens-list" class="p-3 space-y-1.5">
        <!-- Injected via JS -->
      </nav>

      <div class="mt-auto p-4 border-t border-surface-container-highest/60 bg-surface-container-lowest/50">
        <div class="flex items-center gap-2 text-xs text-on-surface-variant">
          <span class="material-symbols-outlined text-[16px] text-secondary">wifi_tethering</span>
          <span>Offline P2P Ready Prototype</span>
        </div>
        <p class="text-[11px] text-outline mt-1 font-mono">NexaLink v1.0.0</p>
      </div>
    </aside>

    <!-- Preview Container Area -->
    <main class="flex-1 bg-surface-container-lowest flex flex-col items-center justify-center p-6 overflow-auto relative">
      <!-- Device Wrapper Container -->
      <div id="device-wrapper" class="relative flex flex-col items-center justify-center shadow-2xl transition-all duration-300">
        <!-- Simulated Device Frame -->
        <div id="frame-chrome" class="w-full flex items-center justify-between px-4 py-2 bg-surface-container-high rounded-t-2xl border-t border-x border-outline-variant/30 text-xs text-on-surface-variant font-mono">
          <div class="flex items-center gap-1.5">
            <div class="w-2.5 h-2.5 rounded-full bg-error/70"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-secondary/70"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-primary/70"></div>
          </div>
          <span id="active-screen-title" class="text-xs text-on-surface font-sans font-medium">Welcome Screen</span>
          <div class="flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">lock</span>
            <span class="text-[10px]">mesh://local</span>
          </div>
        </div>

        <!-- The Iframe -->
        <iframe id="preview-iframe" class="screen-iframe bg-[#111317] border-b border-x border-outline-variant/30 shadow-2xl overflow-y-auto" src="" style="width: 390px; height: 844px; border-bottom-left-radius: 1rem; border-bottom-right-radius: 1rem;"></iframe>
      </div>
    </main>
  </div>

  <script>
    const screens = [
      {
        id: 'welcome_screen',
        name: 'Welcome & Role Selection',
        desc: 'Student/Teacher onboarding',
        icon: 'waving_hand',
        url: 'stitch_campusmesh_ui_prototype/welcome_screen/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/welcome_screen/screen.png'
      },
      {
        id: 'student_login',
        name: 'Student Login',
        desc: 'Peer student authentication',
        icon: 'login',
        url: 'stitch_campusmesh_ui_prototype/student_login/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/student_login/screen.png'
      },
      {
        id: 'student_dashboard',
        name: 'Student Dashboard',
        desc: 'Mesh updates, sync & feed',
        icon: 'dashboard',
        url: 'stitch_campusmesh_ui_prototype/student_dashboard/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/student_dashboard/screen.png'
      },
      {
        id: 'teacher_login',
        name: 'Faculty Login',
        desc: 'Teacher identity verification',
        icon: 'school',
        url: 'stitch_campusmesh_ui_prototype/teacher_login/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/teacher_login/screen.png'
      },
      {
        id: 'teacher_dashboard',
        name: 'Faculty Dashboard',
        desc: 'Lecture broadcaster & peer nodes',
        icon: 'analytics',
        url: 'stitch_campusmesh_ui_prototype/teacher_dashboard/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/teacher_dashboard/screen.png'
      },
      {
        id: 'class_selection',
        name: 'Class & Channel Selection',
        desc: 'Select active mesh channel',
        icon: 'grid_view',
        url: 'stitch_campusmesh_ui_prototype/class_selection/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/class_selection/screen.png'
      },
      {
        id: 'send_announcement',
        name: 'Send Announcement',
        desc: 'Broadcast announcement to peers',
        icon: 'campaign',
        url: 'stitch_campusmesh_ui_prototype/send_announcement/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/send_announcement/screen.png'
      },
      {
        id: 'message_history',
        name: 'Message History',
        desc: 'Encrypted offline chat log',
        icon: 'forum',
        url: 'stitch_campusmesh_ui_prototype/message_history/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/message_history/screen.png'
      },
      {
        id: 'connected_devices',
        name: 'Connected Devices',
        desc: 'Bluetooth / Wi-Fi mesh topology',
        icon: 'wifi_tethering',
        url: 'stitch_campusmesh_ui_prototype/connected_devices/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/connected_devices/screen.png'
      },
      {
        id: 'urgent_alert',
        name: 'Urgent Alert Broadcast',
        desc: 'High-priority emergency alerts',
        icon: 'warning',
        url: 'stitch_campusmesh_ui_prototype/urgent_alert/code.html',
        thumb: 'stitch_campusmesh_ui_prototype/urgent_alert/screen.png'
      }
    ];

    let currentScreen = screens[0];
    let currentViewport = 'mobile';

    const screensListEl = document.getElementById('screens-list');
    const iframeEl = document.getElementById('preview-iframe');
    const titleEl = document.getElementById('active-screen-title');
    const externalBtn = document.getElementById('open-external-btn');
    const frameChrome = document.getElementById('frame-chrome');

    function renderScreenList() {
      screensListEl.innerHTML = '';
      screens.forEach((sc, idx) => {
        const active = sc.id === currentScreen.id;
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-2.5 rounded-xl flex items-center gap-3 transition-all ${
          active 
            ? 'bg-primary/15 border border-primary/40 text-primary shadow-sm' 
            : 'hover:bg-surface-container hover:text-on-surface text-on-surface-variant border border-transparent'
        }`;
        btn.onclick = () => selectScreen(sc);

        btn.innerHTML = `
          <div class="w-10 h-10 rounded-lg overflow-hidden shrink-0 border border-outline-variant/30 bg-surface-container-high flex items-center justify-center relative">
            <img src="${sc.thumb}" class="w-full h-full object-cover object-top" onerror="this.style.display='none'">
            <span class="material-symbols-outlined text-[20px] text-primary absolute" style="display:${sc.thumb ? 'none' : 'block'}">${sc.icon}</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-semibold truncate ${active ? 'text-primary' : 'text-on-surface'}">${sc.name}</div>
            <div class="text-[11px] truncate text-on-surface-variant/80">${sc.desc}</div>
          </div>
          <span class="material-symbols-outlined text-[16px] opacity-60">chevron_right</span>
        `;
        screensListEl.appendChild(btn);
      });
    }

    function selectScreen(sc) {
      currentScreen = sc;
      iframeEl.src = sc.url;
      titleEl.innerText = sc.name;
      externalBtn.href = sc.url;
      renderScreenList();
    }

    function setViewport(mode) {
      currentViewport = mode;
      document.querySelectorAll('.viewport-btn').forEach(b => {
        b.className = 'viewport-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high';
      });

      const activeBtn = document.getElementById('btn-' + mode);
      if (activeBtn) {
        activeBtn.className = 'viewport-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-primary text-surface-dim shadow';
      }

      const wrapper = document.getElementById('device-wrapper');

      if (mode === 'mobile') {
        frameChrome.style.display = 'flex';
        frameChrome.style.width = '390px';
        iframeEl.style.width = '390px';
        iframeEl.style.height = '844px';
        wrapper.className = 'relative flex flex-col items-center justify-center shadow-2xl transition-all duration-300';
      } else if (mode === 'tablet') {
        frameChrome.style.display = 'flex';
        frameChrome.style.width = '768px';
        iframeEl.style.width = '768px';
        iframeEl.style.height = '1024px';
        wrapper.className = 'relative flex flex-col items-center justify-center shadow-2xl transition-all duration-300';
      } else {
        frameChrome.style.display = 'none';
        iframeEl.style.width = '100%';
        iframeEl.style.height = '100%';
        wrapper.className = 'w-full h-full flex flex-col shadow-none transition-all duration-300';
      }
    }

    // Initial run
    selectScreen(screens[0]);
    setViewport('mobile');
  </script>
</body>
</html>
